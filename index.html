<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dove Schools Help Desk</title>
<script src="https://res.cdn.office.net/teams-js/2.22.0/js/MicrosoftTeams.min.js"></script>
<style>
  :root { --bg:#f5f5f5; --card:#fff; --text:#242424; --muted:#616161; --blue:#0052CC; --blue-h:#0747A6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1f1f1f; --card:#292929; --text:#fff; --muted:#adadad; } }
  body.theme-dark { --bg:#1f1f1f; --card:#292929; --text:#fff; --muted:#adadad; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text); font-family:"Segoe UI",system-ui,sans-serif; padding:16px; }
  .card { background:var(--card); border-radius:12px; padding:36px 32px; max-width:440px; width:100%;
          text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.08); }
  h1 { font-size:22px; margin:12px 0 6px; }
  p { color:var(--muted); margin:0 0 24px; line-height:1.4; }
  .btn { display:block; width:100%; padding:12px 16px; margin:10px 0 0; border-radius:6px; border:0;
         font:600 15px "Segoe UI",system-ui,sans-serif; cursor:pointer; text-decoration:none; }
  .primary { background:var(--blue); color:#fff; } .primary:hover { background:var(--blue-h); }
  .secondary { background:transparent; color:var(--blue); border:1px solid var(--blue); }
  body.theme-dark .secondary { color:#8fb8ff; border-color:#8fb8ff; }
  .note { font-size:12px; margin:20px 0 0; }
</style>
</head>
<body>
  <div class="card">
    <svg width="56" height="56" viewBox="0 0 192 192" aria-hidden="true">
      <rect width="192" height="192" rx="36" fill="#0052CC"/>
      <g transform="translate(96 96) scale(0.86) translate(-96 -100)">
<g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
  <path d="M50 112 V98 a46 46 0 0 1 92 0 V112" stroke-width="13"/>
  <path d="M138 140 q0 22 -28 22 h-6" stroke-width="9"/>
</g>
<g fill="#fff">
  <rect x="36" y="94" width="30" height="50" rx="12"/>
  <rect x="126" y="94" width="30" height="50" rx="12"/>
  <rect x="86" y="153" width="24" height="18" rx="9"/>
</g>
      </g>
    </svg>
    <h1>Help Desk</h1>
    <p>Get help from IT, HR, or Finance, or check on a request you've already sent.</p>
    <a class="btn primary" id="newReq" href="https://doveschoolsok.atlassian.net/servicedesk/customer/portals" target="_blank" rel="noopener">Get help</a>
    <a class="btn secondary" id="myReq" href="https://doveschoolsok.atlassian.net/servicedesk/customer/user/requests" target="_blank" rel="noopener">My requests</a>
    <p class="note">Opens the help desk in your browser.</p>
  </div>
<script>
  var inTeams = false;
  try {
    microsoftTeams.app.initialize().then(function () {
      inTeams = true;
      microsoftTeams.app.notifySuccess();
      microsoftTeams.app.getContext().then(function (ctx) {
        var t = ctx && ctx.app && ctx.app.theme;
        if (t === "dark" || t === "contrast") document.body.classList.add("theme-dark");
      });
    }).catch(function () {});
  } catch (e) {}

  function open(e) {
    if (!inTeams) return; // normal link behaviour outside Teams
    e.preventDefault();
    var url = e.currentTarget.href;
    microsoftTeams.app.openLink(url).catch(function () { window.open(url, "_blank"); });
  }
  document.getElementById("newReq").addEventListener("click", open);
  document.getElementById("myReq").addEventListener("click", open);
</script>
</body>
</html>
